name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Mobile Data
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Our Map</title></head><body><div id="__next"></div></body></html>' > out/index.html
          node scripts/prepare-mobile.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant Gradle Execution Permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OurMap-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
